<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Hotels - Guest Information Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #ffffff; 
            margin: 0;
            padding: 0;
        }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #ffffff; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .serif-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }
        .serif-sub {
            font-family: 'Playfair Display', serif;
        }
        .dashed-border-y {
            border-top: 1px dashed #d1d5db;
            border-bottom: 1px dashed #d1d5db;
        }
        .dashed-border-b {
            border-bottom: 1px dashed #d1d5db;
        }

        /* Orijinal 3D Turkuaz Buton Tasarımları Korundu */
        .3d-turkuaz-btn {
            background: linear-gradient(to bottom, #4fc3f7, #0288d1);
            border: 2px solid #01579b;
            border-radius: 12px;
            box-shadow: 
                0 4px 0 #01579b,
                0 8px 16px rgba(0,0,0,0.2),
                inset 0 2px 2px rgba(255,255,255,0.4);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
            cursor: pointer;
        }
        .3d-turkuaz-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #01579b, 0 3px 6px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.2);
        }
        .3d-small-btn {
            background: linear-gradient(to bottom, #4fc3f7, #0288d1);
            border: 1px solid #01579b;
            border-radius: 10px;
            box-shadow: 
                0 3px 0 #01579b,
                0 4px 8px rgba(0,0,0,0.15),
                inset 0 1px 1px rgba(255,255,255,0.4);
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }
        .3d-small-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #01579b, 0 2px 4px rgba(0,0,0,0.15);
        }

        /* Dinamik Dönüşümlü Kutu Stilleri */
        .now-box {
            background: linear-gradient(145deg, #ffffff, #fdfdfd); 
            border: 1px solid #eaeaea; 
            border-radius: 12px; 
            padding: 18px 15px; 
            text-align: left; 
            font-family: 'Montserrat', sans-serif; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
            position: relative;
        }
        #content-wrapper {
            transition: opacity 0.6s ease-in-out; 
            opacity: 1;
        }
        .fade-out {
            opacity: 0 !important;
        }
        .now-title {
            font-size: 12px; 
            color: #8c8c8c; 
            text-transform: uppercase;
            letter-spacing: 2.5px; 
            margin-bottom: 15px; 
            font-weight: 600;
            border-bottom: 1px solid #f0f0f0; 
            padding-bottom: 10px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .event-item {
            font-size: 13px; 
            font-weight: 600;
            color: #2c3e50; 
            margin-bottom: 10px; 
            display: flex;
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #f8f8f8; 
            padding-bottom: 8px;
        }
        .event-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .event-time {
            font-size: 10px; 
            font-weight: 700;
            color: #00a2df; 
            background-color: transparent; 
            border: 1px solid #00a2df; 
            padding: 3px 10px; 
            border-radius: 20px; 
            white-space: nowrap;
            margin-left: 10px;
            letter-spacing: 0.5px;
        }
        .weather-note {
            font-size: 10px;
            color: #a0a0a0;
            text-align: center;
            margin-top: 15px;
            font-style: italic;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- En Üst İnce Grid Çizgileri -->
    <div class="w-full flex justify-between px-4 border-b border-gray-100 py-1 mb-6">
        <span class="w-[1px] h-2 bg-gray-200"></span><span class="w-[1px] h-2 bg-gray-200"></span><span class="w-[1px] h-2 bg-gray-200"></span>
        <span class="w-[1px] h-2 bg-gray-200"></span><span class="w-[1px] h-2 bg-gray-200"></span><span class="w-[1px] h-2 bg-gray-200"></span>
    </div>

    <!-- 1. BÖLÜM: DİL SEÇİM VE DİNAMİK BİLGİ EKRANI -->
    <div id="landing-screen" class="flex-1 flex flex-col justify-between px-6">
        
        <div class="text-center mt-2">
            <h1 class="serif-title text-4xl font-semibold text-gray-800 mb-2 mt-4 tracking-wider">CRYSTAL HOTELS</h1>
            <p class="serif-sub text-lg text-gray-700 italic tracking-wide">Guest Information Hub</p>
        </div>

        <div class="dashed-border-y py-6 my-6 grid grid-cols-2 gap-x-4 gap-y-5">
            <button onclick="selectLanguage('en')" class="3d-turkuaz-btn py-4 w-full">English</button>
            <button onclick="selectLanguage('tr')" class="3d-turkuaz-btn py-4 w-full">Türkçe</button>
            <button onclick="selectLanguage('de')" class="3d-turkuaz-btn py-4 w-full">Deutsch</button>
            <button onclick="selectLanguage('ru')" class="3d-turkuaz-btn py-4 w-full">Русский</button>
        </div>

        <!-- YENİ DİNAMİK "ŞU AN AÇIK" KUTUSU -->
        <div class="now-box mb-6">
            <div id="content-wrapper">
                <div style="text-align:center; color:#888; font-family:'Montserrat', sans-serif;">Loading...</div>
            </div>
        </div>
    </div>


    <!-- 2. BÖLÜM: ANA MENÜ EKRANI -->
    <div id="main-menu-screen" class="hidden flex-1 flex flex-col px-6 pt-4">
        
        <div class="flex justify-between items-center mb-4">
            <button onclick="goBackToLanguages()" class="text-sky-600 font-semibold text-xs flex items-center space-x-1">
                <i class="fa-solid fa-chevron-left"></i> <span id="back-lbl">Geri Dön</span>
            </button>
            <div class="flex space-x-1">
                <button onclick="changeLang('tr')" class="px-2 py-0.5 bg-gray-100 rounded text-xs">🇹🇷 TR</button>
                <button onclick="changeLang('en')" class="px-2 py-0.5 bg-gray-100 rounded text-xs">🇬🇧 EN</button>
                <button onclick="changeLang('de')" class="px-2 py-0.5 bg-gray-100 rounded text-xs">🇩🇪 DE</button>
                <button onclick="changeLang('ru')" class="px-2 py-0.5 bg-gray-100 rounded text-xs">🇷🇺 RU</button>
            </div>
        </div>

        <div class="text-center mb-6">
            <h2 class="serif-title text-2xl font-semibold text-gray-800 mb-2 mt-2">CRYSTAL HOTELS</h2>
            <p id="welcome-text" class="text-xs text-gray-500 leading-relaxed max-w-sm mx-auto">
                Konaklamanız boyunca tüm otel bilgilerine zahmetsizce erişin. Restoran ve bar saatleri, etkinlikler, oda olanakları, harita ve yapay zeka asistanı tek noktada.<br>📱 QR kodu okutun ve keşfedin.
            </p>
        </div>

        <div class="dashed-border-y py-6 grid grid-cols-2 gap-x-4 gap-y-4 mb-6">
            <button class="3d-small-btn flex flex-col items-center justify-center p-4">
                <i class="fa-solid fa-bed text-xl mb-2"></i><span id="btn-room" class="font-bold text-xs">Oda Rehberi</span>
            </button>
            <button class="3d-small-btn flex flex-col items-center justify-center p-4">
                <i class="fa-solid fa-utensils text-xl mb-2"></i><span id="btn-food" class="font-bold text-xs">Yiyecek & İçecek</span>
            </button>
            <button class="3d-small-btn flex flex-col items-center justify-center p-4">
                <i class="fa-solid fa-map-location-dot text-xl mb-2"></i><span id="btn-map" class="font-bold text-xs">Tesis Haritası</span>
            </button>
            <button class="3d-small-btn flex flex-col items-center justify-center p-4">
                <i class="fa-solid fa-icons text-xl mb-2"></i><span id="btn-activities" class="font-bold text-xs">Aktiviteler</span>
            </button>
            <button class="3d-small-btn flex flex-col items-center justify-center p-4">
                <i class="fa-solid fa-book-open-reader text-xl mb-2"></i><span id="btn-menus" class="font-bold text-xs">Menüler</span>
            </button>
            <button class="3d-small-btn flex flex-col items-center justify-center p-4">
                <i class="fa-solid fa-plane-departure text-xl mb-2"></i><span id="btn-transfer" class="font-bold text-xs">Transfer Bilgileri</span>
            </button>
        </div>

        <div class="mb-8">
            <button class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center space-x-2 transition transform active:scale-95">
                <i class="fa-solid fa-robot text-lg"></i><span id="btn-ai" class="text-sm">AI Asistan'a Sorun!</span>
            </button>
        </div>
    </div>

    <!-- ALT KISIM: YATAY ANA LOGO (Her iki ekranda da sabit footer) -->
    <div class="dashed-border-b mt-auto py-6 flex justify-center items-center bg-white px-4 border-t border-gray-100">
        <img src="mainlogo.png" alt="Crystal Hotels" class="h-10 object-contain">
    </div>

</div>

<script>
    // --- 1. ANA MENÜ VE SAYFA İÇİ ÇEVİRİ YÖNETİMİ ---
    const translations = {
        tr: {
            back: "Giriş Ekranı",
            welcome: "Konaklamanız boyunca tüm otel bilgilerine zahmetsizce erişin. Restoran ve bar saatleri, etkinlikler, oda olanakları, harita ve yapay zeka asistanı tek noktada. 📱 QR kodu okutun ve keşfedin.",
            room: "Oda Rehberi", food: "Yiyecek & İçecek", map: "Tesis Haritası", act: "Aktiviteler", menus: "Menüler", transfer: "Transfer Bilgileri", ai: "AI Asistan'a Sorun!"
        },
        en: {
            back: "Home",
            welcome: "Effortlessly access all hotel information during your stay. Restaurant and bar hours, events, room amenities, a map, and an AI assistant, all in one place. 📱 Scan the QR code and explore.",
            room: "Room Guide", food: "Food & Beverage", map: "Hotel Map", act: "Activities", menus: "Menus", transfer: "Transfer Info", ai: "Ask AI Assistant!"
        },
        de: {
            back: "Startseite",
            welcome: "Erhalten Sie während Ihres Aufenthalts mühelos Zugriff auf alle Hotelinformationen. Restaurant- und Barzeiten, Veranstaltungen, Zimmerausstattung, eine Karte und ein KI-Assistent an einem Ort. 📱 Scannen Sie den QR-Code und entdecken Sie mehr.",
            room: "Zimmerleitfaden", food: "Essen & Trinken", map: "Lageplan", act: "Aktivitäten", menus: "Menüs", transfer: "Transfer Info", ai: "KI-Assistent fragen!"
        },
        ru: {
            back: "Назад",
            welcome: "Легко получайте доступ ко всей информации об отеле во время вашего пребывания. Часы работы ресторанов и баров, мероприятия, удобства в номере, карта и ИИ-ассистент — всё в одном месте. 📱 Отсканируйте QR-код и исследуйте.",
            room: "Гид по номеру", food: "Еда и Напитки", map: "Карта Отеля", act: "Мероприятия", menus: "Меню", transfer: "Трансфер", ai: "Спросить ИИ-ассистента!"
        }
    };

    function selectLanguage(lang) {
        changeLang(lang);
        document.getElementById('landing-screen').classList.add('hidden');
        document.getElementById('main-menu-screen').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goBackToLanguages() {
        document.getElementById('main-menu-screen').classList.add('hidden');
        document.getElementById('landing-screen').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changeLang(lang) {
        const t = translations[lang];
        document.getElementById('back-lbl').innerText = t.back;
        document.getElementById('welcome-text').innerHTML = t.welcome;
        document.getElementById('btn-room').innerText = t.room;
        document.getElementById('btn-food').innerText = t.food;
        document.getElementById('btn-map').innerText = t.map;
        document.getElementById('btn-activities').innerText = t.act;
        document.getElementById('btn-menus').innerText = t.menus;
        document.getElementById('btn-transfer').innerText = t.transfer;
        document.getElementById('btn-ai').innerText = t.ai;
    }

    // --- 2. DİNAMİK "ŞU AN AÇIK" WIDGET'I (Sizin Kodunuz) ---
    const uiTexts = {
        en: { title: "OPEN RIGHT NOW", until: "until", weather: "(Activities are subject to change due to weather conditions.)" },
        tr: { title: "ŞU AN AÇIK", until: "kapanış", weather: "(Aktivitelerimiz hava koşullarına bağlı değişiklikler gösterebilir.)" },
        ru: { title: "ОТКРЫТО СЕЙЧАС", until: "до", weather: "(Программа может меняться в зависимости от погодных условий.)" },
        de: { title: "JETZT GEÖFFNET", until: "bis", weather: "(Aktivitäten können sich wetterbedingt ändern.)" }
    };

    const baseSchedule = [
        { name: { en: "🍳 Main Rest. Breakfast (-1. Floor)", tr: "🍳 Ana Restoran Kahvaltı (-1. Kat)", ru: "🍳 Главный Ресторан Завтрак (-1. Этаж)", de: "🍳 Hauptrest. Frühstück (-1. Etage)" }, start: "07:00", end: "11:00" },
        { name: { en: "🍟 Food Court Snack (-2. Floor)", tr: "🍟 Food Court Snack (-2. Kat)", ru: "🍟 Food Court Снэк (-2. Этаж)", de: "🍟 Food Court Snack (-2. Etage)" }, start: "11:00", end: "12:00" },
        { name: { en: "🍔 Snack Restaurants (-2. Floor)", tr: "🍔 Snack Restoranlar (-2. Kat)", ru: "🍔 Снэк-рестораны (-2. Этаж)", de: "🍔 Snack-Restaurants (-2. Etage)" }, start: "12:00", end: "16:00" },
        
        { name: { en: "🏖️ Beach Snack (-1. Floor)", tr: "🏖️ Sahil Snack (-1. Kat)", ru: "🏖️ Пляжный Снэк (-1. Этаж)", de: "🏖️ Strandsnack (-1. Etage)" }, start: "11:00", end: "18:00" },
        { name: { en: "🥙 Flatbread (-1. Floor)", tr: "🥙 Gözleme (-1. Kat)", ru: "🥙 Гёзлеме (-1. Этаж)", de: "🥙 Fladenbrot (-1. Etage)" }, start: "11:00", end: "18:00" },
        
        { name: { en: "🍝 Italian A'la Carte Snack (-1. Floor)", tr: "🍝 İtalyan A'la Carte Snack (-1. Kat)", ru: "🍝 Итальянский Снэк (-1. Этаж)", de: "🍝 Ital. Snack A'la Carte (-1. Etage)" }, start: "12:00", end: "18:00" },
        { name: { en: "🌊 Waterworld Rest. (-1. Floor)", tr: "🌊 Waterworld Restoran (-1. Kat)", ru: "🌊 Ресторан Waterworld (-1. Этаж)", de: "🌊 Waterworld Restaurant (-1. Etage)" }, start: "16:00", end: "18:30" },
        { name: { en: "🍷 Main Rest. Dinner (-1. Floor)", tr: "🍷 Ana Restoran Akşam (-1. Kat)", ru: "🍷 Главный Ресторан Ужин (-1. Этаж)", de: "🍷 Hauptrest. Abendessen (-1. Etage)" }, start: "18:30", end: "21:30" },
        { name: { en: "🌊 Waterworld Night (-1. Floor)", tr: "🌊 Waterworld Gece (-1. Kat)", ru: "🌊 Waterworld Ночной (-1. Этаж)", de: "🌊 Waterworld Nacht (-1. Etage)" }, start: "21:30", end: "08:00" },
        { name: { en: "🍻 Irish Pub (-1. Floor)", tr: "🍻 Irish Pub (-1. Kat)", ru: "🍻 Ирландский Паб (-1. Этаж)", de: "🍻 Irish Pub (-1. Etage)" }, start: "18:00", end: "08:00" },
        
        { name: { en: "🎈 Kids Show", tr: "🎈 Çocuk Şovu (Kids Show)", ru: "🎈 Детское шоу", de: "🎈 Kinder Show" }, start: "20:30", end: "21:15" },
        { name: { en: "🎪 Evening Show", tr: "🎪 Akşam Şovu (Evening Show)", ru: "🎪 Вечернее Шоу", de: "🎪 Abendshow" }, start: "21:15", end: "22:30" },
        { name: { en: "🪩 Disco (-2. Floor)", tr: "🪩 Disko (-2. Kat)", ru: "🪩 Дискотека (-2. Этаж)", de: "🪩 Disco (-2. Etage)" }, start: "23:00", end: "01:30" }
    ];

    const dailyAlacarteMsg = {
        0: { en: "🍽️ All A'la Carte Restaurants are open!", tr: "🍽️ Tüm A'la Carte Restoranlarımız açık!", ru: "🍽️ Все рестораны A'la Carte открыты!", de: "🍽️ Alle A-la-carte-Restaurants sind geöffnet!" },
        1: { en: "🍽️ All A'la Carte Restaurants are open!", tr: "🍽️ Tüm A'la Carte Restoranlarımız açık!", ru: "🍽️ Все рестораны A'la Carte открыты!", de: "🍽️ Alle A-la-carte-Restaurants sind geöffnet!" },
        2: { en: "🍽️ All open except Mediterranean Breeze!", tr: "🍽️ Mediterranean Breeze hariç tüm A'la Cartelar açık!", ru: "🍽️ Открыты все рестораны, кроме Mediterranean Breeze!", de: "🍽️ Alle geöffnet außer Mediterranean Breeze!" },
        3: { en: "🍽️ All open except Latin America!", tr: "🍽️ Latin Amerika hariç tüm A'la Cartelar açık!", ru: "🍽️ Открыты все рестораны, кроме Latin America!", de: "🍽️ Alle geöffnet außer Latin America!" },
        4: { en: "🍽️ All open except Fish Bone!", tr: "🍽️ Fish Bone hariç tüm A'la Cartelar açık!", ru: "🍽️ Открыты все рестораны, кроме Fish Bone!", de: "🍽️ Alle geöffnet außer Fish Bone!" },
        5: { en: "🍽️ All open except Oriental Express!", tr: "🍽️ Oriental Express hariç tüm A'la Cartelar açık!", ru: "🍽️ Открыты все рестораны, кроме Oriental Express!", de: "🍽️ Alle geöffnet außer Oriental Express!" },
        6: { en: "🍽️ All open except ÖZ Restoran!", tr: "🍽️ ÖZ Restoran hariç tüm A'la Cartelar açık!", ru: "🍽️ Открыты все рестораны, кроме ÖZ Restoran!", de: "🍽️ Alle geöffnet außer ÖZ Restoran!" }
    };

    function timeToMinutes(timeStr) {
        let parts = timeStr.split(':');
        return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    }

    function renderContent() {
        let d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Europe/Istanbul' }));
        let currentMinutes = d.getHours() * 60 + d.getMinutes();
        let currentDayIndex = d.getDay(); 

        let todaySchedule = [...baseSchedule];
        let todayAlacarte = dailyAlacarteMsg[currentDayIndex];
        if (todayAlacarte) {
            todaySchedule.push({ name: todayAlacarte, start: "18:30", end: "23:00" });
        }

        let activeEvents = [];
        todaySchedule.forEach(item => {
            let startMin = timeToMinutes(item.start);
            let endMin = timeToMinutes(item.end);
            let isActive = false;

            if (startMin > endMin) { 
                if (currentMinutes >= startMin || currentMinutes < endMin) isActive = true;
            } else {
                if (currentMinutes >= startMin && currentMinutes < endMin) isActive = true;
            }

            if (isActive) {
                let diff = endMin - currentMinutes;
                if (diff <= 0) diff += 1440;
                activeEvents.push({ ...item, timeLeft: diff });
            }
        });

        activeEvents.sort((a, b) => a.timeLeft - b.timeLeft);

        const languages = ['en', 'tr', 'ru', 'de'];
        const flags = { en: "🇬🇧", tr: "🇹🇷", ru: "🇷🇺", de: "🇩🇪" }; 
        let lang = languages[currentLangIndex];

        let activeEventsHTML = "";
        activeEvents.forEach(event => {
            let timeLabel = uiTexts[lang].until + " " + event.end;
            activeEventsHTML += '<div class="event-item"><span>' + event.name[lang] + 
                                '</span> <span class="event-time">' + timeLabel + '</span></div>';
        });

        let finalHTML = '<div class="now-title">' + flags[lang] + ' ' + uiTexts[lang].title + ' ' + flags[lang] + '</div>' + 
                        '<div id="active-events">' + (activeEventsHTML || '<div class="no-event text-center text-gray-500 font-semibold text-sm py-4">Check schedule.</div>') + '</div>' +
                        '<div class="weather-note">' + uiTexts[lang].weather + '</div>';

        let wrapper = document.getElementById('content-wrapper');
        wrapper.classList.add('fade-out');
        
        setTimeout(() => {
            wrapper.innerHTML = finalHTML;
            wrapper.classList.remove('fade-out');
        }, 600); 
    }

    let currentLangIndex = 0;
    setInterval(() => {
        currentLangIndex = (currentLangIndex + 1) % 4;
        renderContent();
    }, 4000);

    renderContent();
</script>

</body>
</html>
